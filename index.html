<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SerSessil | Bento Profile</title>
    <!-- Подключаем супер-надежные иконки Bootstrap Icons -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #101e24 0%, #162d2c 50%, #203d3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bento-container {
            display: grid;
            grid-template-columns: repeat(3, 160px);
            grid-auto-rows: 150px;
            gap: 16px;
            z-index: 10;
        }

        .bento-item {
            background: rgba(16, 30, 36, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 196, 216, 0.15);
            border-radius: 24px;
            padding: 20px;
            color: #dce9ed;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .bento-item:hover {
            transform: translateY(-4px);
            border-color: #e5a93d;
            box-shadow: 0 20px 40px rgba(229, 169, 61, 0.15);
        }

        .profile-block { grid-column: span 2; grid-row: span 2; }
        .photo-block { grid-column: span 1; grid-row: span 2; }
        .links-block { grid-column: span 2; grid-row: span 1; }
        .status-block { grid-column: span 1; grid-row: span 1; }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #e5a93d;
            margin-bottom: 12px;
            object-fit: cover;
        }

        h1 { font-size: 24px; color: #fff; margin-bottom: 2px; }
        .username { color: #e5a93d; font-family: monospace; font-size: 14px; margin-bottom: 10px; }
        .bio { font-size: 13.5px; color: #a2b7bc; text-align: center; line-height: 1.4; }

        .pet-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .social-row {
            display: flex;
            width: 100%;
            height: 100%;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
        }

        .social-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #dce9ed;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .social-btn i { font-size: 24px; color: #e5a93d; }
        .social-btn:hover { color: #fff; }
        .social-btn:hover i { transform: scale(1.1); }

        .status-title { font-size: 11px; text-transform: uppercase; color: #78959a; margin-bottom: 5px; letter-spacing: 1px; }
        .status-value { font-size: 15px; font-weight: 600; color: #bcd6cf; display: flex; align-items: center; gap: 6px; }
        .pulse-dot { width: 8px; height: 8px; background: #4ef2bc; border-radius: 50%; box-shadow: 0 0 8px #4ef2bc; }

        /* ============================================================
           🐾 ЖЕЛЕЗОБЕТОННЫЕ АНИМАЦИИ ПИТОМЦЕВ (БЕГАЮТ ПО ЭКРАНУ)
           ============================================================ */
        .floating-pet {
            position: absolute;
            width: 80px;
            height: 80px;
            pointer-events: none;
            user-select: none;
            z-index: 1;
        }

        @keyframes run-left-right {
            0% { left: -100px; top: 15vh; transform: scaleX(1); }
            50% { left: 110vw; top: 25vh; transform: scaleX(1); }
            51% { transform: scaleX(-1); }
            100% { left: -100px; top: 15vh; transform: scaleX(-1); }
        }
        @keyframes bounce-around {
            0% { right: 10%; bottom: -100px; }
            30% { right: 15%; bottom: 40vh; }
            60% { right: 25%; bottom: 10vh; }
            100% { right: 10%; bottom: -100px; }
        }

        .pet1 { animation: run-left-right 20s infinite linear; }
        .pet2 { animation: bounce-around 15s infinite ease-in-out; }
    </style>
</head>
<body>

    <!-- Настоящие, рабочие анимированные пиксельные питомцы-помощники -->
    <img src="https://openmoji.org" class="floating-pet pet1" alt="cat">
    <img src="https://openmoji.org" class="floating-pet pet2" alt="wolf">

    <div class="bento-container">
        
        <div class="bento-item profile-block">
            <!-- Исправленная прямая CDN-ссылка на вашу аватарку с GitHub -->
            <img src="https://githubusercontent.com" alt="Avatar" class="avatar">
            <h1>SerSessil</h1>
            <div class="username">@SerSessil</div>
            <p class="bio">Linux & Tiling WM Enthusiast.<br>Current setup: Forest Meadow 🌲</p>
        </div>

        <div class="bento-item photo-block" style="padding: 10px;">
            <!-- Ставим надежную красивую картинку лесного тумана под наш стиль -->
            <img src="https://unsplash.com" class="pet-img" alt="Forest Meadow">
        </div>

        <div class="bento-item links-block">
            <div class="social-row">
                <a href="https://github.com" target="_blank" class="social-btn">
                    <i class="bi bi-github"></i>GitHub
                </a>
                <a href="https://t.me" target="_blank" class="social-btn">
                    <i class="bi bi-telegram"></i>Telegram
                </a>
                <a href="#" class="social-btn">
                    <i class="bi bi-discord"></i>Discord
                </a>
            </div>
        </div>

        <div class="bento-item status-block">
            <span class="status-title">Status</span>
            <div class="status-value">
                <div class="pulse-dot"></div> Ricing Sway
            </div>
        </div>

    </div>

</body>
</html>

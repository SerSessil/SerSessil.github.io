<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SerSessil | iOS Bento Profile</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        body {
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Мягкое фоновое свечение */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(90px);
            z-index: 1;
            opacity: 0.3;
        }
        .glow-1 { width: 450px; height: 450px; top: -5%; left: 15%; background: #4ef2bc; animation: float-glow 25s infinite ease-in-out; }
        .glow-2 { width: 500px; height: 500px; bottom: -5%; right: 15%; background: #e5a93d; animation: float-glow 30s infinite ease-in-out-reverse; }

        @keyframes float-glow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 50px) scale(1.15); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Главный планшет-подложка */
        .main-board {
            background: rgba(22, 34, 38, 0.4);
            backdrop-filter: blur(40px) saturate(170%);
            -webkit-backdrop-filter: blur(40px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        /* Сетка Bento-container увеличилась по высоте, чтобы вместить табличку */
        .bento-container {
            display: grid;
            grid-template-columns: repeat(3, 170px);
            grid-auto-rows: 150px;
            gap: 20px;
        }

        /* Премиальное матовое стекло iOS */
        .bento-item {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(168, 196, 216, 0.18);
            border-radius: 32px;
            padding: 20px;
            color: #dce9ed;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25),
                        inset 0 1px 2px rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .bento-item:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(229, 169, 61, 0.5);
            box-shadow: 0 15px 35px rgba(229, 169, 61, 0.15);
        }

        .profile-block { grid-column: span 2; grid-row: span 2; justify-content: flex-start; padding-top: 25px; }
        .fox-right-block { grid-column: span 1; grid-row: span 2; }
        .fox-left-block { grid-column: span 1; grid-row: span 2; }
        .links-block { grid-column: span 2; grid-row: span 1; }
        .status-block { grid-column: span 1; grid-row: span 1; }

        .avatar-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #e5a93d;
            margin-bottom: 10px;
            object-fit: cover;
        }

        h1 { font-size: 24px; color: #fff; margin-bottom: 2px; font-weight: 700; letter-spacing: -0.5px; }
        .username { color: #e5a93d; font-family: monospace; font-size: 13px; margin-bottom: 8px; }
        .bio { font-size: 13px; color: #a2b7bc; text-align: center; line-height: 1.4; margin-bottom: 16px; }

        /* 🍏 ВНУТРЕННЯЯ ТАБЛИЧКА ИНФОРМАЦИИ В СТИЛЕ IOS */
        .info-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 13px;
            color: #bcd6cf;
            line-height: 1.6;
            text-align: center;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.02);
        }
        
        .info-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .bento-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        .social-row {
            display: flex;
            width: 100%;
            height: 100%;
            justify-content: space-around;
            align-items: center;
        }

        .social-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #b0cacc;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .social-btn svg { width: 26px; height: 26px; fill: #b0cacc; transition: all 0.2s; }
        .social-btn:hover { color: #e5a93d; }
        .social-btn:hover svg { transform: translateY(-2px); fill: #e5a93d; }

        .status-title { font-size: 11px; text-transform: uppercase; color: #78959a; margin-bottom: 6px; letter-spacing: 1.5px; font-weight: 600; }
        .status-value { font-size: 14px; font-weight: 600; color: #bcd6cf; display: flex; align-items: center; gap: 8px; }
        .pulse-dot { width: 8px; height: 8px; background: #4ef2bc; border-radius: 50%; box-shadow: 0 0 10px #4ef2bc; }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="main-board">
        <div class="bento-container">
            
            <!-- Блок профиля с новой вложенной табличкой информации -->
            <div class="bento-item profile-block">
                <img src="avatar.png" alt="Avatar" class="avatar-img">
                <h1>SerSessil</h1>
                <div class="username">@SerSessil</div>
                <p class="bio">Linux & Tiling WM Enthusiast.<br>Current setup: Forest Meadow 🌲</p>
                
                <!-- Новая аккуратная карточка с инфой -->
                <div class="info-box">
                    <div class="info-line">❤️ 17yo programmer from Russia 🇷🇺</div>
                    <!-- Замените текст ориентации на свой (например: Straight, Bi, Gay и т.д.) -->
                    <div class="info-line" style="color: #a2b7bc; font-size: 12px; margin-top: 2px;">Orientation: Gay</div>
                </div>
            </div>

            <div class="bento-item fox-right-block" style="padding: 0;">
                <img src="fox2.jpg" class="bento-img" alt="Arctic Fox 2">
            </div>

            <div class="bento-item fox-left-block" style="padding: 0;">
                <img src="fox1.jpg" class="bento-img" alt="Arctic Fox 1">
            </div>

            <div class="bento-item links-block">
                <div class="social-row">
                    <a href="https://github.com" target="_blank" class="social-btn">
                        <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
                        GitHub
                    </a>
                    <a href="https://steamcommunity.com" target="_blank" class="social-btn">
                        <svg viewBox="0 0 24 24"><path d="M21.822 7.436a5.5 5.5 0 0 0-7.391-4.14L9.89 5.861a5.503 5.503 0 0 0-4.512 3.653L.664 11.23a.75.75 0 0 0-.122 1.218l3.96 3.428a5.496 5.496 0 0 0 5.441 1.309l4.542-2.565a5.501 5.501 0 0 0 7.337-7.184zm-16.444 4.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
                        Steam
                    </a>
                </div>
            </div>

            <div class="bento-item status-block">
                <span class="status-title">Status</span>
                <div class="status-value">
                    <div class="pulse-dot"></div> Ricing Sway
                </div>
            </div>

        </div>
    </div>

</body>
</html>

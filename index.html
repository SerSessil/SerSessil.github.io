<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SerSessil | Profile</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #101e24 0%, #162d2c 50%, #203d3a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(16, 30, 36, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 196, 216, 0.2);
            border-radius: 24px;
            width: 450px;
            padding: 30px;
            text-align: center;
            color: #dce9ed;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); border-color: #e5a93d; }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #e5a93d;
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 { font-size: 24px; margin-bottom: 5px; color: #fff; font-weight: 700; }
        .username { color: #e5a93d; font-size: 14px; margin-bottom: 15px; font-family: monospace; }
        .bio { font-size: 14px; color: #a2b7bc; line-height: 1.5; margin-bottom: 25px; }

        .links { display: flex; flex-direction: column; gap: 12px; }
        
        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(229, 169, 61, 0.1);
            border: 1px solid rgba(229, 169, 61, 0.3);
            color: #eaf2f5;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .link-item:hover {
            background: #e5a93d;
            color: #101e24;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(229, 169, 61, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Подгружаем вашу официальную аватарку с GitHub -->
        <img src="https://github.com" alt="Avatar" class="avatar">
        
        <h1>SerSessil</h1>
        <div class="username">@SerSessil</div>
        
        <p class="bio">
            Linux enthusiast & Sway WM user. <br>
            Current setup: Forest Meadow 🌲
        </p>

        <div class="links">
            <a href="https://github.com" target="_blank" class="link-item">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a href="https://t.me" target="_blank" class="link-item">
                <i class="fab fa-telegram"></i> Telegram
            </a>
            <a href="#" class="link-item">
                <i class="fab fa-discord"></i> Discord: sersessil
            </a>
        </div>
    </div>

</body>
</html>
